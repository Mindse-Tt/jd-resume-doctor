# AI 产品经理 · 能力模型 v0.1
#
# 这是"一份好的 AI 产品简历应该长什么样"的正向定义。
# 检测规则不再是拍脑袋列的负面清单，而是「对着这个模型缺了哪一项」。
#
# 每个维度的字段：
#   weight  权重，全部加起来为 1
#   why     为什么这一项能区分候选人（不是为什么它重要）
#   probe   面试官真会问的那一刀——这是维度成立的唯一检验
#   signals 正面证据的字面线索，正则，用于从简历里召回候选句
#   levels  L3 强证据 / L2 说了做了没说为什么 / L1 只沾了个边
#   trap    这一项上最常见的假装有的写法
#
# 改这个文件不用碰代码。加新岗位就复制一份改成 strategy_pm.yaml 之类。

role: 'ai_pm'
name: 'AI 产品经理 / AI 应用产品'
version: "0.1"
source: '基于腾讯 IEG 游戏 AI 助手（洛克王国 AI Coach / 英雄联盟海克斯助手）0-1 与迭代期的真实工作链路提炼'
note: >
  这个模型的判断标准只有一条：面试官会不会因为这句话追问下去。
  能引出「为什么这么设计」的写法算强证据，只能引出「哦」的算弱证据。

dimensions:

  - id: D1
    name: '场景判断与方案选型'
    weight: 0.12
    why: >
      能区分"会用 AI 工具"和"知道什么场景该上 AI"。绝大多数候选人写的是前者——
      罗列一堆工具名，但说不出为什么这个场景选 Workflow 而不是 Skill。
    probe: '这个场景你为什么选 Workflow 不选 Agent？换成 Prompt 行不行？'
    signals:
      - "方案选型|技术选型|选型|为什么(用|选)|而非|而不是"
      - "Workflow|工作流|Skill|Agent|智能体|Prompt|提示词"
      - "判断.{0,8}适合|评估.{0,8}可行性|是否需要"
    levels:
      L3: '说清了在几种方案里怎么选的，并给出判断依据（任务是否高频固定、口径是否统一、是否需要动态规划）'
      L2: '说了最终用了什么方案，没说为什么不用别的'
      L1: '只提到"使用了大模型/AI"，看不出做过选择'
    trap: '把工具清单当能力——"熟练使用 Coze、Dify、Claude Code"证明不了任何判断力'

  - id: D2
    name: '意图理解与路由设计'
    weight: 0.11
    why: >
      多轮对话类产品的第一道分水岭。写得出分支的人不少，
      写得出"分支边界按什么划"的人很少。
    probe: '用户一句话里有两个意图，你怎么处理？拆完怎么合回去？'
    signals:
      - "意图(识别|分类|路由|拆分)|query\\s*(改写|拆分)|复杂度(分级|分层)"
      - "分支|拒答|兜底|多意图|单轮|多轮"
      - "多轮|上下文|history|memory|记忆|摘要"
    levels:
      L3: '有分支划分依据、多意图拆分与合并策略、拒答边界、多轮记忆方案，且说明了各自解决什么问题'
      L2: '列出了有哪些分支，没说边界怎么划、拒答什么时候触发'
      L1: '只说做了"意图识别"'
    trap: '只写"设计了意图识别模块"，问一句"分支怎么划的"就空了'

  - id: D3
    name: '知识生产与检索策略'
    weight: 0.13
    why: >
      讲 RAG 的人 100% 会被问知识是怎么构建的、有多少、里面是什么。
      答不上来说明只是接了个现成的检索接口。
    probe: '不同类型的问题，检索方式一样吗？知识库多大、谁生产的、怎么保证模型看得懂？'
    signals:
      - "RAG|知识库|知识(生产|构建|体系|覆盖)|QA\\s*对"
      - "检索(策略|方式|准确|召回)|向量检索|精确检索|tf-idf|embedding|多轮检索"
      - "重排|rerank|排序|分域|公库|私库|索引"
    levels:
      L3: '知识生产链路（谁给、人怎么补、怎么审）+ 分场景的检索策略 + 数据分层（公私库之类）且说清为什么要分'
      L2: '说了用 RAG、建了知识库，检索方式单一或没说'
      L1: '只出现"RAG"这个词'
    trap: '写"搭建了 RAG 知识库"但说不出知识从哪来、多少条、什么形式组织'

  - id: D4
    name: 'Agent 编排与工具边界'
    weight: 0.11
    why: >
      2026 年的筛选线已经从"会写 Prompt"上移到"能定义 Agent 的能力边界"。
      能说出 tool 粒度取舍的人，一定真做过。
    probe: 'tool 粒度怎么切的？切太细规划会爆炸，切太粗单个 tool 会失控，你怎么定的？'
    signals:
      - "Agent\\s*(架构|编排|嵌套|分层|设计)|Planner|规划器|多\\s*[Aa]gent\\s*(协同|协作|架构)|工具(调用|设计|边界)|tool\\s*(边界|设计)"
      - "tool|工具(调用|设计|边界)|函数调用|function\\s*call"
      - "多\\s*agent|协同|串联|调度"
    levels:
      L3: '说清了 Agent 的层级结构、tool 的分类与能力边界，并给出粒度切分的取舍理由'
      L2: '说了用了 Agent、调了几个工具，没说边界怎么定'
      L1: '只提到"多 Agent 协作"'
    trap: '"多 Agent 协作"当卖点却说不出每个 Agent 的输入输出契约'

  - id: D5
    name: '评测体系'
    weight: 0.14
    why: >
      AI 产品经理和普通产品经理的真正分水岭。90% 的候选人讲不清
      "你怎么知道你的 AI 变好了"。这一项权重最高。
    probe: '你怎么知道这版比上一版好？评测集多少条、谁标的、标注一致性多少？'
    signals:
      - "评测|评估(体系|集|标准|流程)|ground\\s*truth|标注"
      - "北极星|过程指标|效果指标|评测(漏斗|维度)|标注一致|抽检"
      - "评测平台|自动化评测|人评|模型评"
    levels:
      L3: '有指标塔（北极星 + 可归因的过程指标）、评测集构建方式与规模、人评与机评的分工'
      L2: '说了"做了评测"或报了几个正确率，没有口径和评测集'
      L1: '只有结果数字，看不出怎么测的'
    trap: '报一堆 X%→Y% 但说不出评测集是多少条、谁标注的——一问口径全线崩'

  - id: D6
    name: 'badcase 归因'
    weight: 0.11
    why: >
      有评测只是能发现问题，能归因才能推动算法侧改。
      一个 badcase 出现后能不能快速定位到是哪一层的问题，是这行的核心工作。
    probe: '一个 badcase 摆在这儿，你怎么判断是检索的问题还是回复模型的问题？'
    signals:
      - "badcase|bad\\s*case|归因|定位|责任模块|分层"
      - "责任模块|失败模式|逐层|分层(定位|归因)|定位到|问题出在"
      - "事实性错误|理解性|误判|漏检|幻觉"
    levels:
      L3: '有分层归因链路（能说出从输入到输出经过哪几层、每层的失败模式），并区分了哪些能自动判、哪些必须人判'
      L2: '说了会分析 badcase，没有可复述的定位方法'
      L1: '只说"持续优化效果"'
    trap: '把"收集用户反馈"说成归因体系'

  - id: D7
    name: '模型选型与成本延迟'
    weight: 0.09
    why: >
      线上产品必然面对成本和响应速度的约束。能说清"为什么线上用小模型、
      离线才用大模型"的人，说明真的把东西推上过线。
    probe: '线上跑的什么模型？为什么是它？成本和效果差多少？P95 延迟多少？'
    signals:
      - "模型选型|为什么用.{0,12}(模型|deepseek|qwen|gpt|claude)"
      - "成本|token|上下文|context\\s*(window|长度)|参数量|\\d+\\s*[bB]\\b"
      - "延迟|时延|响应(速度|时间)|P9[59]|首包"
    levels:
      L3: '说清了选型依据（成本 / 评测效果 / 上下文 / 领域适配），并区分了线上与离线的不同用法'
      L2: '提到了用什么模型，没说为什么'
      L1: '完全没提模型'
    trap: '只写模型名当技术含量；或把"感知延迟优化"和"真实延迟优化"混着报成一个数'

  - id: D8
    name: '指标的阶段感'
    weight: 0.08
    why: >
      0-1 阶段用过程指标、1-100 才引入业务指标——这个认知层次超过很多两年经验的正式 PM。
      在 0-1 阶段就报 DAU 的人，要么没做过，要么没想清楚。
    probe: '这个产品上线后业务指标动了吗？没动的话你凭什么说它有价值？'
    signals:
      - "0\\s*[-→到]\\s*1|1\\s*[-→到]\\s*100|冷启动|MVP"
      - "过程指标|效果指标|业务指标|北极星|指标塔"
      - "过程指标|效果指标|业务指标|阶段"
    levels:
      L3: '说清了不同阶段看什么指标、为什么，以及效果指标何时转为归因用'
      L2: '报了业务指标或过程指标，没有阶段区分'
      L1: '只有一堆数字，看不出指标体系'
    trap: '0-1 项目直接报 DAU 提升——样本量根本不够，一问统计意义就穿'

  - id: D9
    name: '安全、人设与合规'
    weight: 0.06
    why: >
      面向 C 端的 AI 产品必过的一关。写得出拒答策略和人设约束的人，
      说明产品真的面对过真实用户。
    probe: '什么情况下该拒答？人设跑偏了怎么发现？'
    signals:
      - "拒答|兜底|安全|风控|拦截|合规|违规"
      - "人设|OOC|角色|口吻|语气"
      - "黑话|敏感词|审核"
    levels:
      L3: '有明确的拒答边界定义、人设偏差的监测方式，并说明了取舍（如宁可漏检不可误伤）'
      L2: '提到做了安全或人设，没有具体策略'
      L1: '完全没提'
    trap: '把"接入了安全接口"当作自己的工作'

  - id: D10
    name: '0-1 落地与协作推动'
    weight: 0.05
    why: >
      前面九项都是"想得清楚"，这一项是"推得动"。
      AI 产品的落地一定跨算法、工程、业务三方。
    probe: '你的方案和算法同学意见不一致时，最后是怎么定的？'
    signals:
      - "0\\s*[-→到]\\s*1|从\\s*0|独立负责|主导|牵头|上线"
      - "算法|工程|研发|跨部门|协同|评审|推动"
      - "全量|灰度|推全|A/?B\\s*测试"
    levels:
      L3: '有从定义到上线的完整链路，且能看出跨职能推动中自己的决策边界'
      L2: '说了参与了上线，看不出角色'
      L1: '只有方案设计，没有落地证据'
    trap: '通篇"参与"——面试官会按最低估计理解'

# 分档：达到几项 L3 算什么水平。按真实样本标定，初版是估计值。
bands:
  - min_score: 0.72
    label: '能独立带一个 AI 产品方向'
    advice: '简历层面够了，重点准备每个维度的追问。'
  - min_score: 0.55
    label: '合格的 AI 产品实习/校招候选人'
    advice: '有真实链路，但多数维度停在"做了什么"，补上"为什么这么做"就能上一个台阶。'
  - min_score: 0.35
    label: '沾过 AI，但看不出体系'
    advice: '有零散的 AI 经历，缺少可复述的方法论。优先补评测体系和归因链路这两项。'
  - min_score: 0.0
    label: '不像 AI 产品岗的简历'
    advice: '简历里几乎没有 AI 产品的工作证据，建议先补一段真实项目。'
